[project]
name = "healthcare-data-lakehouse-platform"
version = "0.1.0"
description = "Healthcare data lakehouse with medallion architecture"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E741", "I001", "N812"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert in tests

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "dags/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
